<style>
  /* ---------- 1. COLORES Y CRISTAL ---------- */
  :root {
    --fondo: #070b12; --texto: #eef2f8; --suave: #8d99ad; --acento: #5aa9ff; --acento2: #8f7bff;
    --peligro: #ff6b6b; --aviso: #f0b429;
    --panel: rgba(255,255,255,.06); --elevado: rgba(255,255,255,.09); --linea: rgba(255,255,255,.13);
    --brillo: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(255,255,255,.04);
    --sombra: 0 14px 40px rgba(0,0,0,.4);
    --arriba: env(safe-area-inset-top, 0px); --abajo: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--fondo); }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--texto); font-family: "Inter", -apple-system, system-ui, sans-serif; font-size: 16px; background: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Fondo vivo: tres manchas de color que flotan despacio (lo que el cristal desenfoca) */
  .fondo { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .fondo i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(80px); opacity: .5; animation: flota 24s ease-in-out infinite alternate; }
  .fondo i:nth-child(1) { background: #1f5fff; left: -15vmax; top: -18vmax; }
  .fondo i:nth-child(2) { background: #7a43ff; right: -20vmax; top: 25vh; animation-duration: 30s; opacity: .4; }
  .fondo i:nth-child(3) { background: #00b8a0; left: 5vmax; bottom: -28vmax; animation-duration: 36s; opacity: .32; }
  @keyframes flota { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* El "liquid glass": fondo translúcido + desenfoque + borde y brillo superior */
  .tarea, .asig, .chip, .icono, #aviso, .interruptor, .cat, .btn.sec, #hub, #hoja {
    background: var(--panel); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    border: 1px solid var(--linea); box-shadow: var(--brillo);
  }

  /* ---------- 2. DISEÑO ---------- */
  .app { max-width: 640px; margin: 0 auto; padding: calc(var(--arriba) + 14px) 18px calc(var(--abajo) + 110px); }
  #hub { display: none; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 18px; }
  .logo { width: 30px; height: 30px; filter: drop-shadow(0 0 10px rgba(90,169,255,.5)); }
  .marca .acciones { margin-left: auto; display: flex; gap: 10px; }
  header { margin: 6px 0 16px; }
  h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
  #contador { color: var(--suave); font-size: 14px; margin-top: 4px; }
  .leyenda { color: var(--suave); font-size: 12px; margin: 0 0 14px; }
  .icono { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .15s; font-weight: 600; }
  .icono:active { transform: scale(.92); }
  .icono svg { width: 20px; height: 20px; stroke: var(--suave); fill: none; stroke-width: 1.8; }

  .tarea { display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 14px 16px 14px 0; margin-bottom: 10px; overflow: hidden; cursor: pointer; transition: background .2s, transform .2s; box-shadow: var(--brillo), var(--sombra); }
  .barra { width: 6px; align-self: stretch; border-radius: 0 6px 6px 0; flex: none; transition: background .6s, box-shadow .6s; }
  .hecho { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: none; flex: none; padding: 0; cursor: pointer; transition: all .2s; }
  .hecho:hover, .hecho:active { background: rgba(90,169,255,.3); border-color: var(--acento); transform: scale(1.12); }
  .nombre { flex: 1; min-width: 0; }
  .nombre b { display: block; font-weight: 500; overflow-wrap: anywhere; }
  .nombre span { color: var(--suave); font-size: 13px; }
  .nombre span em { font-style: normal; color: var(--aviso); }
  .imp { text-align: right; flex: none; }
  .imp strong { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .imp span { display: block; color: var(--suave); font-size: 12px; font-variant-numeric: tabular-nums; }

<script>
  /* ---------- 3. LÓGICA ---------- */
  const DIA = 86400000;
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const PALETA = ["#ff5d73", "#5aa9ff", "#35d6a4", "#b08cff", "#ffb13d", "#4dd0e1", "#ff8fd1"];
  const baseCats = () => [
    { id: 1, nombre: "Salud", base: 8, ritmo: 0.2, tope: 12, color: PALETA[0] }, { id: 2, nombre: "Trabajo", base: 5, ritmo: 0.6, tope: 12, color: PALETA[1] },
    { id: 3, nombre: "Hogar", base: 3, ritmo: 1.0, tope: 12, color: PALETA[2] }, { id: 4, nombre: "Ocio", base: 1, ritmo: 0.5, tope: 8, color: PALETA[3] }];

  /* --- Memoria (localStorage) --- */
  const CLAVE = "prioridades-v1";
  // Completa y repara un estado (sea local, de la nube o de una copia antigua)
  function normalizar(e) {
    if (e.filtro === undefined || !e.categorias.some((c) => c.id === e.filtro)) e.filtro = null;   // null = ver todas
    if (!e.usuario) e.usuario = { nombre: "" };
    e.categorias.forEach((c, i) => { if (!c.color) c.color = c.nombre === "Estudio" ? "#ffb13d" : PALETA[i % PALETA.length]; });
    if (!e.asignaturas) e.asignaturas = [];   // asignaturas con sus exámenes
    if (!e.hechas) e.hechas = [];             // papelera: lo completado o eliminado (30 días)
    if (!e.horas) e.horas = [];               // historial: { t, asigId, horas }
    e.config = Object.assign({ urgMax: 10, mitad: 7, tope: 12, estudio: [1, 3, 4.5], meta: 3 }, e.config);   // ajustes de la fecha límite y tope total
    e.categorias.forEach((c) => { if (c.tope == null) c.tope = c.nombre === "Ocio" ? 8 : 12; });   // tope por categoría
    e.tareas.forEach((t) => {   // completa las tareas guardadas con versiones antiguas
      if (t.ultima == null) t.ultima = t.creada;
      if (t.rec == null) t.rec = 1;
      if (t.fin === undefined) t.fin = null;
      if (t.base === undefined) t.base = null;   // importancia propia (null = la de la categoría)
      if (t.ciclo == null) t.ciclo = 8;          // días que tarda una rutina en volver a su máximo
      if (t.quita == null) t.quita = 3;      // puntos que pierde al marcarla
      if (t.tasa == null) t.tasa = 1;        // puntos que recupera por día
      if (t.pen == null) { t.pen = 0; t.penT = 0; }   // penalización acumulada y cuándo se anotó
    });
    return e;
  }
  function cargar() {
    let e = null;
    try { const r = localStorage.getItem(CLAVE); if (r) e = JSON.parse(r); } catch (x) {}
    return normalizar(e || { categorias: baseCats(), tareas: [], sig: 100 });
  }
  // Cada cambio: se guarda en el dispositivo con la hora ("mod") y se programa su subida a la nube
  function guardar() { estado.mod = Date.now(); try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} subirLuego(); }
  let estado = cargar();

  /* --- El reloj. SIMULACIÓN (temporal): "desfase" adelanta el reloj; al borrar la simulación, ahora() = Date.now() --- */
  const SIMULACION = false;   // true = versión de pruebas con el panel de simulación
  const CLAVE_SIM = "prioridades-sim";
  let desfase = 0, velocidad = 0;   // velocidad = ms simulados por cada segundo real
  if (SIMULACION) try { desfase = Number(localStorage.getItem(CLAVE_SIM)) || 0; } catch (e) {}
  const guardarSim = () => { try { localStorage.setItem(CLAVE_SIM, desfase); } catch (e) {} };
  const ahora = () => Date.now() + desfase;

  /* --- LA FÓRMULA ---
     "base" = la importancia propia de la tarea o, si no tiene, la de su categoría.
     · CON fecha límite:  base + cercanía − puntos perdidos al estudiar   (cercanía = máx ÷ (1 + días que faltan ÷ mitad))
     · RUTINA (se repite, sin fecha): al marcarla baja a 0 y sube cada día hasta llegar a su base en "ciclo" días
     · NORMAL (sin fecha, no se repite): base + puntos por día de la categoría × días esperando
     · TOPE: nunca pasa del tope de su categoría ni del total (si pones importancia propia, solo cuenta el tope total).
             Los puntos perdidos se restan después del tope. Si empatan, va primero la de mayor valor real. */
  function puntosPorHoras(h) {
    const X = [0, 1.5, 3.5, 6.5], Y = [0, ...estado.config.estudio];
    for (let i = 1; i < 4; i++) if (h <= X[i]) return Y[i - 1] + (Y[i] - Y[i - 1]) * (h - X[i - 1]) / (X[i] - X[i - 1]);
    return Y[3] + ((Y[3] - Y[2]) / (X[3] - X[2])) * 0.5 * (h - X[3]);
  }
  function calcular(t) {
    const cat = estado.categorias.find((c) => c.id === t.catId) || { nombre: "?", base: 0, ritmo: 0, color: "#5aa9ff" };
    const n = ahora(), base = t.base != null ? t.base : cat.base;
    const dias = Math.max(0, (n - t.ultima) / DIA);
    let modo = "normal", porTiempo = 0, urg = 0, resta = null, pen = 0, frac = 1, bruto;
    if (t.fin) {
      modo = "fecha"; resta = (t.fin - n) / DIA;
      urg = estado.config.urgMax / (1 + Math.max(0, resta) / estado.config.mitad);
      if (t.rep && t.pen) pen = Math.max(0, t.pen - t.tasa * Math.max(0, (n - t.penT) / DIA));
      bruto = base + urg;
    } else if (t.rep) {
      modo = "rutina"; frac = Math.min(1, dias / (t.ciclo || 8)); bruto = base * frac;
    } else { porTiempo = cat.ritmo * dias; bruto = base + porTiempo; }
    const techo = t.base != null ? estado.config.tope : Math.min(cat.tope ?? 12, estado.config.tope);
    return { cat, base, modo, frac, porTiempo, urg, resta, pen, topado: bruto > techo, real: bruto - pen, total: Math.max(0, Math.min(bruto, techo) - pen) };
  }
  // Cada categoría tiene su color (solo se usa su tono); cuanto más importante, más saturado, claro y con más brillo
  function tono(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
    if (!d) return 215;
    const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (Math.round(h * 60) + 360) % 360;
  }
  function estiloBarra(cat, total, maximo) {
    const t = Math.min(1, total / Math.max(maximo, 10)), c = `hsl(${tono(cat.color || "#5aa9ff")} ${Math.round(14 + 76 * t)}% ${Math.round(38 + 24 * t)}%)`;
    return `background:${c};box-shadow:0 0 ${Math.round(2 + 18 * t)}px ${c}`;
  }
  function dur(d) {
    if (d >= 1) return Math.floor(d) + " d " + Math.floor((d % 1) * 24) + " h";
    if (d >= 1 / 24) return Math.floor(d * 24) + " h";
    return Math.max(1, Math.floor(d * 1440)) + " min";
  }
  const aTexto = (ms) => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const aMs = (txt) => new Date(txt + "T23:59:00").getTime();

  let vista = "pri", htmlFiltros = "", htmlLista = "";
  // Pinta la lista y anima: las tareas nuevas aparecen deslizándose y las que cambian de sitio se desplazan suavemente
  function pintarLista(html) {
    if (html === htmlLista) return;                                  // si nada cambió, no se toca
    const antes = {};
    document.querySelectorAll("#tareas .tarea").forEach((el) => antes[el.dataset.id] = el.getBoundingClientRect().top);
    $("tareas").innerHTML = html; htmlLista = html;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let k = 0;
    document.querySelectorAll("#tareas .tarea").forEach((el) => {
      const a = antes[el.dataset.id];
      if (a == null) el.animate([{ opacity: 0, transform: "translateY(12px) scale(.98)" }, { opacity: 1, transform: "none" }], { duration: 400, delay: Math.min(k++, 8) * 45, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
      else { const dy = a - el.getBoundingClientRect().top; if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 450, easing: "cubic-bezier(.2,.8,.2,1)" }); }
    });
  }

  // La tarea "Estudiar X" de cada asignatura siempre apunta a su próximo examen
  function sincronizar() {
    const n = ahora();
    estado.asignaturas.forEach((a) => {
      const t = estado.tareas.find((x) => x.auto && x.asigId === a.id); if (!t) return;
      const prox = a.examenes.filter((e) => e.fecha >= n).sort((x, y) => x.fecha - y.fecha)[0];
      t.fin = prox ? prox.fecha : null; t.examen = prox ? prox.nombre : null; t.nombre = "Estudiar " + a.nombre;
    });
  }
  function crearAsignatura(nombre, examenes) {
    let cat = estado.categorias.find((c) => c.nombre === "Estudio");
    if (!cat) { cat = { id: estado.sig++, nombre: "Estudio", base: 5, ritmo: 0.6, tope: 12, color: "#ffb13d" }; estado.categorias.push(cat); }
    const a = { id: estado.sig++, nombre, examenes };
    estado.asignaturas.push(a);
    estado.tareas.push({ id: estado.sig++, nombre: "Estudiar " + nombre, catId: cat.id, rep: true, auto: true, asigId: a.id, fin: null, tasa: 1, pen: 0, penT: 0, rec: 1, creada: ahora(), ultima: ahora() });
    return a;
  }
  function dibujarLista() {
    sincronizar(); document.body.dataset.vista = vista;
    const todas = estado.tareas.map((t) => ({ t, ...calcular(t) })).sort((a, b) => (b.total - a.total) || (b.real - a.real));
    const datos = estado.filtro == null ? todas : todas.filter((d) => d.t.catId === estado.filtro);   // la vista elegida
    const maximo = estado.config.tope;   // el color va de 0 al tope total
    const suma = datos.reduce((a, d) => a + d.total, 0);   // cómputo total de puntos de lo que se ve
    $("contador").textContent = datos.length + (datos.length === 1 ? " tarea" : " tareas") + " · " + suma.toFixed(1) + " puntos";
    const cuentas = {}; todas.forEach((d) => cuentas[d.t.catId] = (cuentas[d.t.catId] || 0) + 1);
    const htmlF = `<button class="chip ${estado.filtro == null ? "sel" : ""}" data-f="">Todas<small>${todas.length}</small></button>` +
      estado.categorias.map((c) => `<button class="chip ${estado.filtro === c.id ? "sel" : ""}" data-f="${c.id}"><span class="pt" style="background:${c.color}"></span>${esc(c.nombre)}<small>${cuentas[c.id] || 0}</small></button>`).join("");
    if (htmlF !== htmlFiltros) { $("filtros").innerHTML = htmlF; htmlFiltros = htmlF; }   // solo se redibuja si cambia
    const htmlT = datos.length ? datos.map((d) => {
      const fin = d.resta == null ? "" : d.resta < 0 ? ` · <em>vencida</em>` : ` · <em>${d.t.examen ? esc(d.t.examen) : "vence"} en ${dur(d.resta)}</em>`;
      const desglose = d.modo === "rutina" ? `${d.base} × ${Math.round(d.frac * 100)} %` : `${d.base} + ` + (d.modo === "fecha" ? d.urg.toFixed(1) : d.porTiempo.toFixed(1)) + (d.pen > 0.05 ? ` − ${d.pen.toFixed(1)}` : "") + (d.topado ? " · tope" : "");
      return `<div class="tarea" data-id="${d.t.id}">
        <div class="barra" style="${estiloBarra(d.cat, d.total, maximo)}"></div>
        <button class="hecho" aria-label="Completar"></button>
        <div class="nombre"><b>${esc(d.t.nombre)}</b><span>${esc(d.cat.nombre)}${d.modo === "rutina" ? " · rutina" + (d.frac < 1 ? " · al máximo en " + dur((1 - d.frac) * (d.t.ciclo || 8)) : " · lista para hacer") : d.t.rep ? " · se repite" : ""}${fin}</span></div>
        <div class="imp"><strong>${d.total.toFixed(1)}</strong><span>${desglose}</span></div></div>`;
    }).join("") : todas.length ? '<div class="vacio">No hay tareas en esta categoría.</div>'
      : '<div class="vacio">No hay tareas todavía.<br>Crea la primera con «Nueva tarea».</div>';
    pintarLista(htmlT);
    document.querySelectorAll(".simFecha").forEach((el) => el.textContent = new Date(ahora()).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" }) + (desfase ? " (simulado)" : ""));
    dibujarAsig(); dibujarPap(); pintarProgreso();
  }

  // Barra de progreso: tareas completadas hoy frente a la meta diaria
  function pintarProgreso() {
    const d0 = new Date(ahora()); d0.setHours(0, 0, 0, 0);
    const hoy = estado.hechas.filter((h) => h.tipo === "hecha" && h.t >= d0.getTime()).length, meta = estado.config.meta;
    $("pFill").style.width = Math.min(100, hoy / meta * 100) + "%";
    $("pFill").classList.toggle("lleno", hoy >= meta);
    $("pTxt").textContent = hoy >= meta ? "¡Meta de hoy cumplida! · " + hoy + " hechas" : "Hoy: " + hoy + " de " + meta + " hechas";
  }
  // Papelera: lo completado o eliminado en los últimos 30 días (se restaura lo que desapareció)
  function dibujarPap() {
    estado.hechas = estado.hechas.filter((h) => h.t >= ahora() - 30 * DIA);
    const lista = [...estado.hechas].sort((a, b) => b.t - a.t);
    if (vista === "pap") $("contador").textContent = lista.length + (lista.length === 1 ? " elemento" : " elementos") + " en los últimos 30 días";
    let dia = "", html = lista.length ? '<button class="btn sec" id="vaciarPap" style="margin:0 0 14px">Vaciar papelera</button>' : "";
    lista.forEach((h) => {
      const d = new Date(h.t), etiqueta = d.toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
      if (etiqueta !== dia) { dia = etiqueta; html += `<h4 style="text-transform:capitalize">${etiqueta}</h4>`; }
      const cat = estado.categorias.find((c) => c.id === h.catId);
      html += `<div class="item"><span class="pt" style="background:${cat ? cat.color : "#6b7688"}"></span>
        <div class="nombre"><b>${esc(h.nombre)}</b><span>${h.tipo === "eliminada" ? "<em>Eliminada</em> · " : ""}${cat ? esc(cat.nombre) + " · " : ""}${d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}${h.horas ? " · " + h.horas + " h" : ""}</span></div>
        ${h.tarea ? `<button class="chip" data-r="${h.id}">Restaurar</button>` : ""}</div>`;
    });
    $("pap").innerHTML = html || '<div class="vacio">La papelera está vacía.<br>Aquí aparece lo que completas o eliminas durante 30 días.</div>';
  }

  // Pantalla de asignaturas: horas, próximo examen y posición en la prioridad
  function dibujarAsig() {
    const n = ahora(), r1 = (x) => Math.round(x * 10) / 10;
    const todas = estado.tareas.map((t) => ({ t, ...calcular(t) })).sort((a, b) => (b.total - a.total) || (b.real - a.real));
    const suma = (arr) => arr.reduce((x, h) => x + h.horas, 0);
    const info = estado.asignaturas.map((a) => {
      const hs = estado.horas.filter((h) => h.asigId === a.id);
      return { a, total: suma(hs), semana: suma(hs.filter((h) => n - h.t < 7 * DIA)), ultimo: hs.length ? Math.max(...hs.map((h) => h.t)) : null,
               prio: todas.find((d) => d.t.auto && d.t.asigId === a.id) };
    }).sort((x, y) => (y.prio.total - x.prio.total) || (y.prio.real - x.prio.real));
    const tot = suma(estado.horas), sem = suma(estado.horas.filter((h) => n - h.t < 7 * DIA));
    if (vista === "asig") $("contador").textContent = info.length + (info.length === 1 ? " asignatura" : " asignaturas") + " · " + r1(tot) + " h en total · " + r1(sem) + " h esta semana";
    $("asigs").innerHTML = '<button class="btn sec" id="nuevaAsig" style="margin:0 0 14px">+ Nueva asignatura</button>' + (info.length ? info.map((i, k) => {
      const p = i.prio, ex = p.resta != null && p.resta >= 0 ? `${esc(p.t.examen)} en ${dur(p.resta)}` : "sin examen próximo";
      return `<div class="asig" data-id="${i.a.id}">
        <div class="cab2"><b>${esc(i.a.nombre)}</b><span class="pos">n.º ${k + 1} · ${p.total.toFixed(1)} pts</span></div>
        <div class="det">Próximo: ${ex}<br>Esta semana ${r1(i.semana)} h · total ${r1(i.total)} h${tot ? " · " + Math.round(i.total / tot * 100) + " % del tiempo" : ""}<br>
          ${i.ultimo ? "Último estudio hace " + dur((n - i.ultimo) / DIA) : "Aún sin horas registradas"}</div>
        <div class="reparto"><i style="width:${tot ? i.total / tot * 100 : 0}%"></i></div></div>`;
    }).join("") : '<div class="vacio">Aún no hay asignaturas.<br>Añade la primera con sus fechas de examen.</div>');
  }

  /* --- Ventana / hoja de formularios --- */
  function abrir(html) {   // todas las ventanas llevan un botón × arriba para cerrarlas
    $("hoja").innerHTML = '<button class="cerrar" id="cerrarHoja" aria-label="Cerrar">×</button>' + html;
    $("cerrarHoja").onclick = cerrar; $("hoja").scrollTop = 0; document.body.classList.add("abierta");
  }
  addEventListener("keydown", (e) => { if (e.key === "Escape") cerrar(); });
  function cerrar() { document.body.classList.remove("abierta"); }
  $("velo").onclick = cerrar;
  function refrescar() { guardar(); dibujarLista(); ajustes($("hubAjustes")); }

  function formTarea(t) {
    let sel = t ? t.catId : (estado.filtro ?? estado.categorias[0].id);   // si estás en una vista, la propone
    abrir(`<h3>${t ? "Editar tarea" : "Nueva tarea"}</h3>
      <div class="campo"><label>Nombre</label><input type="text" id="fNombre" value="${t ? esc(t.nombre) : ""}" placeholder="¿Qué hay que hacer?" autocomplete="off"></div>
      <div class="campo"><label>Categoría</label><div class="chips" id="chips"></div></div>
      <div class="campo"><label>Importancia propia (vacío = la de la categoría)</label>
        <input type="number" id="fBase" step="0.5" inputmode="decimal" value="${t && t.base != null ? t.base : ""}"></div>
      ${estado.asignaturas.length ? '<div class="campo"><label>Asignatura (opcional)</label><div class="chips" id="chipsAsig"></div></div>' : ""}
      <div class="campo"><label>Fecha límite (opcional)</label>
        <div class="fila2"><input type="date" id="fFin" value="${t && t.fin ? aTexto(t.fin) : ""}"><button class="chip" id="fSin" type="button">Quitar</button></div></div>
      <label class="interruptor"><span>Se repite<small>Al marcarla no se borra: baja y vuelve a subir (rutina)</small></span>
        <input type="checkbox" id="fRep" ${t && t.rep ? "checked" : ""}></label>
      <div id="fRecCaja"><div class="campo"><span class="peq">Recupera (puntos por día)</span>
        <input type="number" id="fRec" step="0.5" min="0.1" inputmode="decimal" value="${t ? t.tasa : 1}">
        <p class="nota">Al marcarla te preguntará cuántas horas has dedicado: más horas, más puntos pierde.</p></div></div>
      <div class="campo" id="fCicloCaja"><span class="peq">Al marcarla baja a 0 y vuelve a su importancia máxima en (días)</span><input type="number" id="fCiclo" step="1" min="1" inputmode="numeric" value="${t && t.ciclo ? t.ciclo : 8}"></div>
      ${t && t.asigId ? '<button class="btn sec" id="fHoras">Registrar horas dedicadas</button>' : ""}
      <button class="btn" id="fGuardar">Guardar</button>
      ${t ? '<button class="btn peligro" id="fBorrar">Eliminar tarea</button>' : '<button class="btn sec" id="fCancelar">Cancelar</button>'}`);
    const pintar = () => $("chips").innerHTML = estado.categorias.map((c) =>
      `<button class="chip ${c.id === sel ? "sel" : ""}" data-id="${c.id}">${esc(c.nombre)}<small>${c.base}</small></button>`).join("");
    let asig = t ? t.asigId ?? null : null;
    const pintarA = () => { if (!$("chipsAsig")) return; $("chipsAsig").innerHTML = `<button class="chip ${asig == null ? "sel" : ""}" data-id="">Ninguna</button>` +
      estado.asignaturas.map((a) => `<button class="chip ${a.id === asig ? "sel" : ""}" data-id="${a.id}">${esc(a.nombre)}</button>`).join(""); };
    pintarA();
    if ($("chipsAsig")) $("chipsAsig").onclick = (e) => { const b = e.target.closest(".chip"); if (b) { asig = b.dataset.id === "" ? null : Number(b.dataset.id); pintarA(); } };
    if ($("fHoras")) $("fHoras").onclick = () => formHoras(t, t.asigId);
    const ph = () => { const c = estado.categorias.find((x) => x.id === sel); $("fBase").placeholder = c ? "Categoría: " + c.base : ""; };
    const mostrarRec = () => { const r = $("fRep").checked, f = $("fFin").value; $("fRecCaja").style.display = r && f ? "block" : "none"; $("fCicloCaja").style.display = r && !f ? "block" : "none"; };
    pintar(); mostrarRec(); ph();
    $("chips").onclick = (e) => { const b = e.target.closest(".chip"); if (b) { sel = Number(b.dataset.id); pintar(); ph(); } };
    $("fRep").onchange = mostrarRec;
    $("fSin").onclick = () => { $("fFin").value = ""; mostrarRec(); };
    $("fFin").onchange = mostrarRec;
    $("fGuardar").onclick = () => {
      const nombre = $("fNombre").value.trim();
      if (!nombre) return $("fNombre").focus();
      const datos = { nombre, catId: sel, rep: $("fRep").checked, tasa: Math.max(0.1, Number($("fRec").value) || 1), asigId: asig,
        base: $("fBase").value === "" ? null : Number($("fBase").value), ciclo: Math.max(1, Number($("fCiclo").value) || 8), fin: $("fFin").value ? aMs($("fFin").value) : null };
      if (t) Object.assign(t, datos);
      else estado.tareas.push({ id: estado.sig++, creada: ahora(), ultima: datos.rep && !datos.fin ? ahora() - datos.ciclo * DIA : ahora(), pen: 0, penT: 0, ...datos });
      refrescar(); cerrar();
    };
    if (t) $("fBorrar").onclick = () => {
      estado.hechas.push({ id: estado.sig++, tipo: "eliminada", t: ahora(), nombre: t.nombre, catId: t.catId, horas: 0, tarea: JSON.parse(JSON.stringify(t)) });
      estado.tareas = estado.tareas.filter((x) => x !== t); refrescar(); cerrar();
    };
    else $("fCancelar").onclick = cerrar;
  }

  function pintarUsuario() {
    const n = estado.usuario.nombre;
    $("avatar").innerHTML = n ? esc(n[0].toUpperCase()) : '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
  }
  function formUsuario() {
    abrir(`<h3>Tu espacio</h3>
      <div class="campo"><label>Tu nombre</label><input type="text" id="uNombre" value="${esc(estado.usuario.nombre)}" placeholder="Cómo quieres que te llame" autocomplete="off"></div>
      <div class="interruptor"><span id="uCuenta"></span></div>
      <button class="btn sec" id="uSesion"></button>
      <h4>Copia de seguridad</h4>
      <p class="nota">Tus datos viven solo en este dispositivo. Copia este texto y guárdalo (por ejemplo en Notas); para recuperarlos, pégalo más abajo.</p>
      <textarea id="uCopia" readonly rows="3"></textarea>
      <button class="btn sec" id="uCopiar">Copiar copia de seguridad</button>
      <textarea id="uPegar" rows="3" placeholder="Pega aquí una copia para restaurar" style="margin-top:14px"></textarea>
      <button class="btn sec" id="uRestaurar">Restaurar desde el texto</button>
      <button class="btn" id="uOk">Listo</button>`);
    $("uCopia").value = JSON.stringify(estado);
    $("uCuenta").innerHTML = sesion ? esc(sesion.user.email) + "<small>" + esc($("sync").title) + "</small>" : "Sin cuenta<small>Los datos solo están en este dispositivo</small>";
    $("uSesion").textContent = sesion ? "Cerrar sesión" : "Iniciar sesión";
    $("uSesion").onclick = async () => {
      if (!sesion) { cerrar(); $("login").hidden = false; return; }
      await subir(); try { localStorage.removeItem(CLAVE); } catch (x) {}   // sube lo pendiente y borra la copia local
      await sb.auth.signOut(); location.reload();
    };
    $("uNombre").oninput = (e) => { estado.usuario.nombre = e.target.value.trim(); guardar(); pintarUsuario(); };
    $("uCopiar").onclick = async () => {
      try { await navigator.clipboard.writeText($("uCopia").value); $("uCopiar").textContent = "Copiado ✓"; }
      catch (x) { $("uCopia").select(); $("uCopiar").textContent = "Selecciona el texto y cópialo a mano"; }
    };
    $("uRestaurar").onclick = (e) => {
      if (!e.target.dataset.ok) { e.target.dataset.ok = 1; e.target.textContent = "Toca otra vez: sustituye tus datos actuales"; return; }
      try {
        const d = JSON.parse($("uPegar").value); if (!d.tareas || !d.categorias) throw 0;
        d.mod = Date.now();   // la copia restaurada cuenta como el cambio más reciente
        localStorage.setItem(CLAVE, JSON.stringify(d)); location.reload();
      } catch (x) { e.target.textContent = "Ese texto no es una copia válida"; }
    };
    $("uOk").onclick = cerrar;
  }

  function formAsig(a) {
    const ex = a ? a.examenes.map((e) => ({ ...e })) : [];
    abrir(`<h3>${a ? "Editar asignatura" : "Nueva asignatura"}</h3>
      <div class="campo"><label>Nombre</label><input type="text" id="aNombre" value="${a ? esc(a.nombre) : ""}" placeholder="Ej. Física" autocomplete="off"></div>
      <div class="campo"><label>Exámenes</label><div id="aEx"></div>
        <div class="chips" id="aTipos" style="margin-top:8px"><button class="chip" data-n="Parcial">+ Parcial</button><button class="chip" data-n="Práctico">+ Práctico</button><button class="chip" data-n="Final">+ Final</button></div>
        <p class="nota">Un examen sin fecha no se guarda. «Estudiar» apunta siempre al próximo examen que quede.</p></div>
      <button class="btn" id="aOk">Guardar</button>
      ${a ? '<button class="btn peligro" id="aDel">Eliminar asignatura</button>' : '<button class="btn sec" id="aNo">Cancelar</button>'}`);
    const pintar = () => $("aEx").innerHTML = ex.map((e, i) => `<div class="fila2" style="margin-bottom:8px">
      <input type="text" data-i="${i}" data-k="nombre" value="${esc(e.nombre)}" style="flex:1">
      <input type="date" data-i="${i}" data-k="fecha" value="${e.fecha ? aTexto(e.fecha) : ""}" style="flex:1.3">
      <button class="x" data-q="${i}" aria-label="Quitar">×</button></div>`).join("");
    pintar();
    $("aEx").oninput = (e) => { const i = e.target.dataset.i; if (i == null) return; const k = e.target.dataset.k; ex[i][k] = k === "fecha" ? (e.target.value ? aMs(e.target.value) : null) : e.target.value; };
    $("aEx").onclick = (e) => { const b = e.target.closest(".x"); if (b) { ex.splice(Number(b.dataset.q), 1); pintar(); } };
    $("aTipos").onclick = (e) => { const b = e.target.closest(".chip"); if (b) { ex.push({ nombre: b.dataset.n, fecha: null }); pintar(); } };
    $("aOk").onclick = () => {
      const nombre = $("aNombre").value.trim(); if (!nombre) return $("aNombre").focus();
      const examenes = ex.filter((e) => e.fecha).map((e) => ({ nombre: e.nombre.trim() || "Examen", fecha: e.fecha }));
      if (a) { a.nombre = nombre; a.examenes = examenes; } else crearAsignatura(nombre, examenes);
      refrescar(); cerrar();
    };
    if (a) $("aDel").onclick = (e) => {
      if (!e.target.dataset.ok) { e.target.dataset.ok = 1; e.target.textContent = "Toca otra vez: borra también sus horas"; return; }
      estado.tareas = estado.tareas.filter((x) => !(x.auto && x.asigId === a.id));
      estado.tareas.forEach((x) => { if (x.asigId === a.id) x.asigId = null; });
      estado.horas = estado.horas.filter((h) => h.asigId !== a.id);
      estado.asignaturas = estado.asignaturas.filter((x) => x !== a);
      refrescar(); cerrar();
    };
    if (!a) $("aNo").onclick = cerrar;
  }

  /* --- Panel de categorías, ajustes y simulación (en la barra lateral del ordenador o en una hoja en el móvil) --- */
  function ajustes(cont) {
    const filas = estado.categorias.map((c) => {
      const enUso = estado.tareas.some((t) => t.catId === c.id);
      return `<div class="cat" data-id="${c.id}">
        <div class="cab"><input type="color" class="color" data-campo="color" value="${c.color || "#5aa9ff"}"><input type="text" data-campo="nombre" value="${esc(c.nombre)}"><button class="borrar" data-act="borrar" ${enUso ? "disabled" : ""} aria-label="Borrar">×</button></div>
        <div class="nums">
          <div><span class="peq">Base</span><input type="number" step="0.5" inputmode="decimal" data-campo="base" value="${c.base}"></div>
          <div><span class="peq">Puntos/día</span><input type="number" step="0.1" inputmode="decimal" data-campo="ritmo" value="${c.ritmo}"></div>
          <div><span class="peq">Tope</span><input type="number" step="0.5" inputmode="decimal" data-campo="tope" value="${c.tope}"></div>
        </div></div>`; }).join("");
    const op = (v, txt) => `<option value="${v}" ${velocidad === v ? "selected" : ""}>${txt}</option>`;
    cont.innerHTML = `<h4>Categorías</h4>${filas}
      <button class="btn sec" data-act="addCat">+ Nueva categoría</button>
      <h4>Fecha límite y tope</h4>
      <div class="nums2" style="grid-template-columns:repeat(3,1fr);gap:8px">
        <div><span class="peq">Puntos de fecha</span><input type="number" step="1" inputmode="decimal" data-cfg="urgMax" value="${estado.config.urgMax}"></div>
        <div><span class="peq">Días a la mitad</span><input type="number" step="1" inputmode="decimal" data-cfg="mitad" value="${estado.config.mitad}"></div>
        <div><span class="peq">Tope total</span><input type="number" step="1" inputmode="decimal" data-cfg="tope" value="${estado.config.tope}"></div>
      </div>
      <h4>Barra de progreso</h4>
      <div class="nums2"><div><span class="peq">Meta diaria (tareas hechas)</span><input type="number" step="1" inputmode="numeric" data-cfg="meta" value="${estado.config.meta}"></div></div>
      <h4>Puntos que pierde al estudiar</h4>
      <div class="nums2" style="grid-template-columns:repeat(3,1fr);gap:8px">
        <div><span class="peq">1,5 horas</span><input type="number" step="0.5" inputmode="decimal" data-est="0" value="${estado.config.estudio[0]}"></div>
        <div><span class="peq">3,5 horas</span><input type="number" step="0.5" inputmode="decimal" data-est="1" value="${estado.config.estudio[1]}"></div>
        <div><span class="peq">6,5 horas</span><input type="number" step="0.5" inputmode="decimal" data-est="2" value="${estado.config.estudio[2]}"></div>
      </div>
      <p class="nota">El tope de una categoría y el tope total frenan la subida de puntos. Una categoría con tareas no se puede borrar. Los datos se guardan solo en este dispositivo.</p>
      <button class="btn peligro" data-act="borrarTodo">Borrar todos los datos</button>

      ${SIMULACION ? `<div class="sim">
        <h4>Simulación (temporal)</h4>
        <div class="fecha simFecha"></div>
        <div class="botones">
          <button class="btn sec" data-act="sim" data-ms="3600000">+1 hora</button>
          <button class="btn sec" data-act="sim" data-ms="86400000">+1 día</button>
          <button class="btn sec" data-act="sim" data-ms="604800000">+1 semana</button>
        </div>
        <span class="peq">Avance automático</span>
        <select data-act="vel">${op(0, "Parado")}${op(3600000, "1 segundo = 1 hora")}${op(86400000, "1 segundo = 1 día")}</select>
        <button class="btn sec" data-act="escenario">Cargar escenario de exámenes</button>
        <button class="btn sec" data-act="presente">Volver al presente</button>
      </div>`: ""}`;
    dibujarLista();
    cont.oninput = (e) => {
      const caja = e.target.closest(".cat");
      if (caja) {
        const c = estado.categorias.find((x) => x.id === Number(caja.dataset.id)), campo = e.target.dataset.campo;
        c[campo] = campo === "nombre" || campo === "color" ? e.target.value : Number(e.target.value) || 0;
      } else if (e.target.dataset.est != null) estado.config.estudio[Number(e.target.dataset.est)] = Math.max(0, Number(e.target.value) || 0);
      else if (e.target.dataset.cfg) estado.config[e.target.dataset.cfg] = Math.max(1, Number(e.target.value) || 1);
      else return;
      guardar(); dibujarLista();
    };
    cont.onchange = (e) => { if (e.target.dataset.act === "vel") velocidad = Number(e.target.value); };
    cont.onclick = (e) => {
      const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.disabled) return;
      const act = b.dataset.act, caja = b.closest(".cat");
      if (act === "borrar") { const id = Number(caja.dataset.id); estado.categorias = estado.categorias.filter((c) => c.id !== id); if (estado.filtro === id) estado.filtro = null; }
      else if (act === "addCat") estado.categorias.push({ id: estado.sig++, nombre: "Nueva", base: 1, ritmo: 0.5, tope: 12, color: PALETA[estado.categorias.length % PALETA.length] });
      else if (act === "borrarTodo") {
        if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "Toca otra vez para confirmar"; return; }
        estado = { categorias: baseCats(), tareas: [], sig: 100, config: { urgMax: 10, mitad: 7, tope: 12, estudio: [1, 3, 4.5], meta: 3 }, filtro: null, asignaturas: [], horas: [], hechas: [], usuario: estado.usuario };
      } else if (act === "sim") { desfase += Number(b.dataset.ms); guardarSim(); dibujarLista(); return; }
      else if (act === "presente") { desfase = 0; velocidad = 0; guardarSim(); }
      else if (act === "escenario") {   // el ejemplo del examen: sube con la fecha, se marca, baja y vuelve a subir
        const n = ahora(), cat = (nom) => (estado.categorias.find((c) => c.nombre === nom) || estado.categorias[0]).id;
        const ex = (nom, d) => ({ nombre: nom, fecha: n + d * DIA });
        const calc = crearAsignatura("Cálculo", [ex("Parcial", 14), ex("Final", 40)]);
        const fis = crearAsignatura("Física", [ex("Final", 20)]);
        const est = crearAsignatura("Estructuras", [ex("Práctico", 10), ex("Final", 45)]);
        [[calc, 1, 3], [calc, 3, 2], [fis, 2, 1.5], [est, 4, 1]].forEach(([as, dias, h]) => estado.horas.push({ t: n - dias * DIA, asigId: as.id, horas: h }));
        [["Llamar al dentista", "Salud", null, false, 0], ["Limpiar el balcón", "Hogar", null, false, 4.5], ["Ver esa serie", "Ocio", null, false, 2]]
          .forEach(([nom, c, fin, rep, d]) => estado.tareas.push({ id: estado.sig++, nombre: nom, catId: cat(c), fin, rep, tasa: 1, pen: 0, penT: 0, creada: n - d * DIA, ultima: n - d * DIA }));
      }
      refrescar(); if (cont !== $("hubAjustes")) ajustes(cont);
    };
  }
  $("avatar").onclick = formUsuario;
  $("ajustes").onclick = () => { abrir('<h3>Ajustes</h3><div id="hojaAjustes"></div><button class="btn" id="hojaListo" style="margin-top:18px">Listo</button>'); ajustes($("hojaAjustes")); $("hojaListo").onclick = cerrar; };

  /* --- Completar tarea y registrar horas (con deshacer) --- */
  let copia = null, cuenta = null;
  const foto = () => JSON.stringify({ t: estado.tareas, h: estado.horas, d: estado.hechas });
  const registrar = (asigId, horas) => estado.horas.push({ t: ahora(), asigId, horas });
  function avisar(texto) {
    $("aviso").firstElementChild.textContent = texto; $("aviso").style.display = "flex"; clearTimeout(cuenta);
    cuenta = setTimeout(() => $("aviso").style.display = "none", 4000);
  }
  function completar(t, horas) {
    copia = foto();
    let texto = "Tarea completada";
    // Se anota en la papelera. Si la tarea desaparece (no se repite), se guarda una copia para poder restaurarla
    estado.hechas.push({ id: estado.sig++, tipo: "hecha", t: ahora(), nombre: t.nombre, catId: t.catId, horas: horas || 0, tarea: t.rep ? null : JSON.parse(JSON.stringify(t)) });
    if (t.rep && (t.fin || t.asigId)) {                                // se estudia: se pregunta por las horas
      if (t.fin) { const p = puntosPorHoras(horas); t.pen = calcular(t).pen + p; t.penT = ahora(); texto = "Registradas " + horas + " h · −" + p.toFixed(1) + " puntos"; }
      else { t.ultima = ahora(); texto = "Registradas " + horas + " h"; }
      if (t.asigId && horas > 0) registrar(t.asigId, horas);           // y se guardan en el historial
    } else if (t.rep) t.ultima = ahora();                              // sin fecha: su tiempo vuelve a cero
    else estado.tareas = estado.tareas.filter((x) => x !== t);         // única: desaparece
    refrescar(); avisar(texto);
  }
  // Ventana para indicar cuántas horas has dedicado (soloAsig = solo guardar horas, sin perder puntos)
  function formHoras(t, soloAsig) {
    let horas = 2;
    const pierde = !soloAsig && t.rep && t.fin, asigId = soloAsig || t.asigId, asg = estado.asignaturas.find((x) => x.id === asigId);
    abrir(`<h3>${esc(t.nombre)}</h3>
      <div class="campo"><label>¿Cuántas horas has dedicado?</label><div class="chips" id="hChips"></div></div>
      <div class="campo"><label>O escríbelo</label><input type="number" id="hNum" step="0.5" min="0" inputmode="decimal" value="2"></div>
      <p class="nota" id="hPrev"></p>
      <button class="btn" id="hOk">Registrar</button><button class="btn sec" id="hNo">Cancelar</button>`);
    const pintar = () => {
      $("hChips").innerHTML = [0.5, 1, 2, 3, 4, 6, 8].map((h) => `<button class="chip ${h === horas ? "sel" : ""}" data-h="${h}">${h} h</button>`).join("");
      $("hPrev").textContent = pierde ? "Pierde " + puntosPorHoras(horas).toFixed(1) + " puntos" : "Se suman a " + (asg ? asg.nombre : "el historial");
    };
    pintar();
    $("hChips").onclick = (e) => { const b = e.target.closest(".chip"); if (b) { horas = Number(b.dataset.h); $("hNum").value = horas; pintar(); } };
    $("hNum").oninput = (e) => { horas = Math.max(0, Number(e.target.value) || 0); pintar(); };
    $("hOk").onclick = () => {
      cerrar();
      if (soloAsig) { copia = foto(); registrar(soloAsig, horas); refrescar(); avisar("Registradas " + horas + " h"); } else completar(t, horas);
    };
    $("hNo").onclick = cerrar;
  }
  $("tareas").onclick = (e) => {
    const fila = e.target.closest(".tarea"); if (!fila) return;
    const t = estado.tareas.find((x) => x.id === Number(fila.dataset.id));
    if (!e.target.closest(".hecho")) return t.auto ? formAsig(estado.asignaturas.find((x) => x.id === t.asigId)) : formTarea(t);   // tocar la fila = editar
    if (t.rep && (t.fin || t.asigId)) formHoras(t); else completar(t, 0);
  };
  $("deshacer").onclick = () => { const f = JSON.parse(copia); estado.tareas = f.t; estado.horas = f.h; estado.hechas = f.d || []; refrescar(); $("aviso").style.display = "none"; };
  $("nueva").onclick = $("nuevaEsc").onclick = () => formTarea(null);
  const cambiarVista = (v) => { vista = v; $("tabPri").classList.toggle("sel", v === "pri"); $("tabAsig").classList.toggle("sel", v === "asig"); $("tabPap").classList.toggle("sel", v === "pap"); dibujarLista(); };
  $("tabPri").onclick = () => cambiarVista("pri");
  $("tabAsig").onclick = () => cambiarVista("asig");
  $("tabPap").onclick = () => cambiarVista("pap");
  $("pap").onclick = (e) => {
    const vaciar = e.target.closest("#vaciarPap");
    if (vaciar) {
      if (!vaciar.dataset.ok) { vaciar.dataset.ok = 1; vaciar.textContent = "Toca otra vez para vaciar"; return; }
      estado.hechas = []; return refrescar();
    }
    const b = e.target.closest("[data-r]"); if (!b) return;
    const h = estado.hechas.find((x) => x.id === Number(b.dataset.r)); if (!h || !h.tarea) return;
    const t = h.tarea; if (estado.tareas.some((x) => x.id === t.id)) t.id = estado.sig++;
    estado.tareas.push(t); estado.hechas = estado.hechas.filter((x) => x !== h); refrescar();
  };
  $("asigs").onclick = (e) => {
    if (e.target.closest("#nuevaAsig")) return formAsig(null);
    const c = e.target.closest(".asig"); if (c) formAsig(estado.asignaturas.find((x) => x.id === Number(c.dataset.id)));
  };
  $("filtros").onclick = (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    estado.filtro = b.dataset.f === "" ? null : Number(b.dataset.f);
    guardar(); dibujarLista();
  };

  // El reloj interno: refresca cada 30 s (o cada 0,5 s si hay simulación automática)
  let n = 0;
  setInterval(() => {
    if (velocidad) { desfase += velocidad / 2; guardarSim(); dibujarLista(); }
    else if (++n % 60 === 0) dibujarLista();
  }, 500);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { dibujarLista(); traer(); } });
  /* ---------- NUBE (Supabase): login por correo y sincronización ---------- */
  const SUPA_URL = "https://dfxypoltwizzszozuweq.supabase.co";
  const SUPA_KEY = "sb_publishable_9qVxZEklpS88aMsMHyvE-w_zYS7dnjJ";   // clave pública: la seguridad la ponen las reglas de la tabla
  const sb = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;   // null = sin conexión al abrir
  let sesion = null, pendiente = false, subiendo = false, sucio = 0, temporizadorSync = null;

  function marcarEstado(texto, clase) { $("sync").className = "sync " + clase; $("sync").title = texto; }
  function subirLuego() {                       // cada cambio espera 0,8 s por si vienen más, y se sube
    if (!sesion) return;
    pendiente = true; sucio++; marcarEstado("Guardando…", "pend");
    clearTimeout(temporizadorSync); temporizadorSync = setTimeout(subir, 800);
  }
  async function subir() {                      // todo el estado va en una sola fila de la tabla "estado"
    if (!sesion || subiendo) return;
    subiendo = true; const version = sucio;
    try {
      const { error } = await sb.from("estado").upsert({ user_id: sesion.user.id, datos: estado, actualizado: new Date().toISOString() });
      if (error) throw error;
      pendiente = sucio !== version; marcarEstado("Sincronizado", "ok");
    } catch (e) { marcarEstado("Sin conexión: se subirá cuando vuelva", "off"); }
    subiendo = false;
    if (pendiente && sucio !== version) subirLuego();
  }
  function adoptar(d) {                         // sustituye lo local por lo que hay en la nube
    estado = normalizar(d); pendiente = false;
    try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {}
    dibujarLista(); ajustes($("hubAjustes")); pintarUsuario();
  }
  async function traer() {                      // la regla: gana el cambio más reciente
    if (!sesion || subiendo || document.body.classList.contains("abierta")) return;
    try {
      const { data, error } = await sb.from("estado").select("datos").maybeSingle();
      if (error) throw error;
      const vacio = (e) => !e.tareas.length && !e.asignaturas.length && !e.horas.length;
      if (!data) { if (!vacio(estado)) await subir(); else marcarEstado("Sincronizado", "ok"); return; }
      const lm = estado.mod || 0, rm = data.datos.mod || 0;
      if (vacio(estado) || rm > lm) adoptar(data.datos);
      else if (lm > rm) await subir();
      marcarEstado("Sincronizado", "ok");
    } catch (e) { marcarEstado("Sin conexión", "off"); }
  }
  async function iniciarNube() {
    if (!sb) { $("login").hidden = false; $("lMsg").textContent = "No se pudo cargar la conexión. Comprueba tu internet."; return; }
    const { data } = await sb.auth.getSession();
    sesion = data.session;
    sb.auth.onAuthStateChange((evento, s) => {
      const entra = !sesion && s; sesion = s;
      if (entra) { $("login").hidden = true; traer(); }
    });
    if (sesion) traer(); else $("login").hidden = false;
  }
  const credenciales = () => ({ email: $("lEmail").value.trim(), password: $("lPass").value });
  $("lEntrar").onclick = async () => {
    const c = credenciales();
    if (!sb) return $("lMsg").textContent = "No se cargó la conexión con Supabase. Recarga la página o desactiva el bloqueador de contenido.";
    if (!c.email || !c.password) return $("lMsg").textContent = "Escribe tu correo y tu contraseña.";
    $("lMsg").textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword(c);   // si va bien, onAuthStateChange entra solo
    if (error) $("lMsg").textContent = /invalid/i.test(error.message) ? "Correo o contraseña incorrectos." : "No se pudo entrar: " + error.message;
  };
  $("lCrear").onclick = async () => {                          // solo la primera vez
    const c = credenciales();
    if (!sb) return $("lMsg").textContent = "No se cargó la conexión con Supabase. Recarga la página o desactiva el bloqueador de contenido.";
    if (!c.email || c.password.length < 6) return $("lMsg").textContent = "Escribe tu correo y una contraseña de al menos 6 caracteres.";
    $("lMsg").textContent = "Creando cuenta…";
    const { data, error } = await sb.auth.signUp(c);
    if (error) return $("lMsg").textContent = "No se pudo crear la cuenta: " + error.message;
    if (!data.session) $("lMsg").textContent = "Cuenta creada, pero Supabase pide confirmar el correo: desactiva «Confirm email» en su panel o confírmalo desde el correo y pulsa Entrar.";
  };
  $("lPass").onkeydown = (e) => { if (e.key === "Enter") $("lEntrar").click(); };
  $("lSin").onclick = () => { $("login").hidden = true; };
  setInterval(() => { if (pendiente) subir(); else traer(); }, 30000);           // reintenta y comprueba cambios de otros dispositivos
  addEventListener("online", () => { if (pendiente) subir(); else traer(); });

  pintarUsuario();
  ajustes($("hubAjustes"));
  iniciarNube();
</script>
</body>
</html>
